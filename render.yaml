services:
  # -------------------------
  # 1. Backend API (FastAPI)
  # -------------------------
  - type: web
    name: bugflow-nexus-api-shannu
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: bugtracker-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        # Allow Render frontend domains
        value: "https://bugflow-nexus-shannu.onrender.com,http://localhost:5173"

  # -------------------------
  # 2. Frontend UI (React+Vite)
  # -------------------------
  - type: web
    name: bugflow-nexus-shannu
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://bugflow-nexus-api-shannu.onrender.com"
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: bugtracker-db
    databaseName: bugtracker_db
    plan: free
